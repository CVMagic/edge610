# ixgbe must probe after the board initializer selects the X553 1G SGMII path.
blacklist ixgbe
options edge610_switch_standalone cpu_port=10 x553_sgmii=1 cpu_mac_ctl=0x203e serdes_autoneg=1
# DSA setup resets CPU port 10 physical control; restore the board value.
options edge610_dsa conduit_name=eno1 force_cpu_phyctl=0x203e
